  technique-update-preview:
    needs: explorer-labels
    if: "${{ !cancelled() && ((contains(github.event.issue.labels.*.name, 'content: update technique') && contains(github.event.issue.labels.*.name, 'form input')) || needs.explorer-labels.outputs.kind == 'update-technique') }}"
