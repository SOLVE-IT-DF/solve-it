# Rebuild reporting_scripts/assets/ontology_classes.json, the list of CASE, UCO
# and SOLVE-IT terms the Explorer's edit form offers for the ontology fields.
#
# The list is checked in rather than fetched on every hourly build (see
# reporting_scripts/assets/README.md), so something has to refresh it when the
# SOLVE-IT ontology changes. The solve-it-ontology repository sends an
# `ontology-updated` repository_dispatch event, carrying the pushed commit, from
# .github/workflows/notify-solve-it.yml whenever a push to its main branch
# touches a module. It can also be run by hand, for example after a new CASE/UCO
# release, from the Actions tab.
name: Refresh ontology term list

on:
  repository_dispatch:
    types: [ontology-updated]
  workflow_dispatch:
    inputs:
      solveit_ref:
        description: SOLVE-IT ontology branch, tag or commit to build from
        default: main

permissions:
  contents: write

# Two ontology pushes in quick succession would otherwise race to push here.
# GitHub keeps one pending run per group and cancels older pending ones, which
# is fine: the surviving run builds from the newest commit, which includes the
# earlier ones.
concurrency:
  group: refresh-ontology-classes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Passed through the environment, not interpolated into the script, so a
      # ref cannot inject shell. GITHUB_TOKEN authenticates the GitHub API call
      # that lists the ontology's modules: Actions runners share IP addresses,
      # and anonymous calls are limited to 60 an hour per address.
      - name: Build ontology term list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOLVEIT_REF: ${{ github.event.client_payload.sha || inputs.solveit_ref || 'main' }}
        run: python reporting_scripts/build_ontology_classes.py --solveit-ref "$SOLVEIT_REF"

      - name: Commit and push
        env:
          SOLVEIT_REF: ${{ github.event.client_payload.sha || inputs.solveit_ref || 'main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reporting_scripts/assets/ontology_classes.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Refresh ontology term list [skip ci]" \
            -m "Built from solve-it-ontology at ${SOLVEIT_REF}."
          # Another job may have pushed to main while this one ran.
          git pull --rebase
          git push
