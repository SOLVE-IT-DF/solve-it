name: Update changelog

on:
  workflow_run:
    workflows: ["Validate knowledge base"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  update-changelog:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: '3.12'

    - name: Update changelog
      run: python3 admin/generate_changelog.py --append --project-root .

    - name: Commit and push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add changelog/changelog.jsonl changelog/CHANGELOG_DATA.md changelog/CHANGELOG_FEATURES.md changelog/CHANGELOG_STRUCTURE.md
        git diff --cached --quiet && echo "No changes to commit" && exit 0
        git commit -m "Update changelog [skip ci]"
        # The "Update data version" workflow also pushes to main; retry on a
        # rejected push. Only this job writes the changelog files, so the
        # rebase cannot conflict on them.
        for attempt in 1 2 3 4 5; do
          if git pull --rebase --quiet origin main && git push; then
            exit 0
          fi
          sleep $((attempt * 5))
        done
        echo "Could not push the changelog update after 5 attempts" >&2
        exit 1
