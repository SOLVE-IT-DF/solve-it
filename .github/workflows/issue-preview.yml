      env:
        ISSUE_BODY: ${{ github.event.issue.body }}

    - name: Generate TRWM preview comment
      run: |
        python3 admin/issue_parsers/parse_trwm_submission.py \
          --project-root . \
          --issue-body-file issue_body.md \
          --output comment.md \
          --labels-output labels.txt

    - name: Post comment on issue
      run: |
        gh issue comment "$ISSUE_NUMBER" --body-file comment.md
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}

    - name: Apply auto-detected labels
      run: |
        if [ -s labels.txt ]; then
          while IFS= read -r label; do
            gh issue edit "$ISSUE_NUMBER" --add-label "$label"
          done < labels.txt
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
